name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@72e7d0077ffa1a9a1341fa3239ff15282cf66248 # v4.9.1

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@72e7d0077ffa1a9a1341fa3239ff15282cf66248 # v4.9.1
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
