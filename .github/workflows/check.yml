name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@efabecf2fba436e990a9f9865ed4532845e1e710 # v4.6.1

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@efabecf2fba436e990a9f9865ed4532845e1e710 # v4.6.1
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
