name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@32c81994f6677a00a9d5f1fec6338ad15e641fe0 # v4.6.0

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@32c81994f6677a00a9d5f1fec6338ad15e641fe0 # v4.6.0
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
