name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@7971851395511ca7b1f5dbaea1835d9253f18388 # v4.7.1

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@7971851395511ca7b1f5dbaea1835d9253f18388 # v4.7.1
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
