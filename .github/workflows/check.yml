name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@2563735dba59f6c566472e5259c166c146c2cacf # v4.3.1

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@2563735dba59f6c566472e5259c166c146c2cacf # v4.3.1
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
