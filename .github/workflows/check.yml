name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@abcd91d90282cfe0f35cf46fce67818a6a5e513b # v4.8.0

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@abcd91d90282cfe0f35cf46fce67818a6a5e513b # v4.8.0
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
