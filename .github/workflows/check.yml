name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@e369ce8f658250de66c8a7e6945bf7bb592648ab # v4.6.2

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@e369ce8f658250de66c8a7e6945bf7bb592648ab # v4.6.2
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
