name: Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    uses: wetransform/gha-workflows/.github/workflows/gradle-library-check.yml@835bff77f691fa8307f03ab6d1b79f6f478bd0a5 # v4.7.2

  docker:
    uses: wetransform/gha-workflows/.github/workflows/gradle-service-check.yml@835bff77f691fa8307f03ab6d1b79f6f478bd0a5 # v4.7.2
    with:
      image-tag: wetransform/hale-cli:latest # image to scan
      # don't run tests since this is already done in check
      gradle-tasks: clean dockerTagLatest
      expect-tests: false
